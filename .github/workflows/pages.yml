# GitHub Pages: the web app (data in the browser, games from
# Lichess and Chess.com, statistics from the files next to it), and the opening statistics of the
# latest release stats-year-YYYY-MM (12 months; else the latest month stats-YYYY-MM) under /stats/ (Pages allows other origins: CORS *, for the mobile
# app). https://<owner>.github.io/<repo>/
name: Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [apps/web/**, packages/**, pnpm-lock.yaml, .github/workflows/pages.yml]
  workflow_run:
    workflows: [Opening statistics]
    types: [completed]

permissions:
  contents: read
  # deploy-pages reads the artifact of this run through the API.
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Two jobs, as in GitHub's own Pages workflow: deployed from the same job, the artifact was
  # sometimes not visible yet ("Fetching artifact metadata failed").
  build:
    # Not after the statistics test runs (push): their files are not published.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter web...
      - name: Build the app (static)
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          pnpm --filter web --fail-if-no-match build
          mkdir -p site
          cp -r apps/web/dist/. site/
          # Every route of the app is index.html: Pages serves 404.html for the unknown paths.
          cp site/index.html site/404.html
          touch site/.nojekyll
      - name: Latest statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest() {
            gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName \
              --jq "[.[].tagName | select(test(\"^$1\$\"))] | sort | last // empty"
          }
          tag=$(latest 'stats-year-[0-9]{4}-[0-9]{2}')
          tag=${tag:-$(latest 'stats-[0-9]{4}-[0-9]{2}')}
          if [ -z "$tag" ]; then echo "Pas encore de release de statistiques : app sans statistiques"; exit 0; fi
          echo "Statistiques : $tag"
          mkdir -p site/stats
          # The app's files only (not the month's whole stats.db, kept for the year's merge).
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -D site/stats -p 'stats-*.db.gz' -p index.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
